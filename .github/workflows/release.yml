name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  release:
    name: Release build (win-x64)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $version = "0.1.0-dev.$($env:GITHUB_SHA.Substring(0, 7))"
          }
          "VIBE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Version: $version"

      - name: Restore
        run: dotnet restore VibeUninstaller.slnx

      - name: Build
        run: dotnet build VibeUninstaller.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test VibeUninstaller.slnx --configuration Release --no-build

      - name: Publish GUI (self-contained, single file)
        run: >
          dotnet publish src/VibeUninstaller.App/VibeUninstaller.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:Version=${{ env.VIBE_VERSION }}
          --output artifacts/gui

      - name: Publish CLI (self-contained, single file)
        run: >
          dotnet publish src/VibeUninstaller.Cli/VibeUninstaller.Cli.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:Version=${{ env.VIBE_VERSION }}
          --output artifacts/cli

      - name: Verify the portable CLI runs without a .NET install
        shell: pwsh
        run: |
          $exe = "artifacts/cli/vibe.exe"
          if (-not (Test-Path $exe)) { throw "vibe.exe was not produced" }
          & $exe version
          & $exe list --json --limit 2 | Out-String | Write-Host

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build the setup executable
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe was not found at $iscc" }
          & $iscc "/DAppVersion=$env:VIBE_VERSION" "installer\VibeUninstaller.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-ChildItem artifacts/installer | Select-Object Name, Length

      - name: Stage release files
        shell: pwsh
        run: |
          $v = $env:VIBE_VERSION
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          Copy-Item artifacts/gui/VibeUninstaller.exe "artifacts/release/VibeUninstaller-$v-portable.exe"
          Copy-Item artifacts/cli/vibe.exe "artifacts/release/vibe-$v-portable.exe"
          Copy-Item "artifacts/installer/VibeUninstaller-$v-setup.exe" "artifacts/release/VibeUninstaller-$v-setup.exe"
          Get-ChildItem artifacts/release | Select-Object Name, Length

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            --title "VibeUninstaller $env:VIBE_VERSION" `
            --generate-notes `
            "artifacts/release/VibeUninstaller-$env:VIBE_VERSION-setup.exe" `
            "artifacts/release/VibeUninstaller-$env:VIBE_VERSION-portable.exe" `
            "artifacts/release/vibe-$env:VIBE_VERSION-portable.exe"

      - name: Upload build artifacts (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: VibeUninstaller-${{ env.VIBE_VERSION }}
          path: artifacts/release/*
          if-no-files-found: error
